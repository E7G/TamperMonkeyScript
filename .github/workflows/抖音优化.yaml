name: Build Douyin userscript

on:
  push:
    branches: [master]
    paths:
      - "scripts-vite/抖音优化/**"
      - "script-components/**"
      - "lib/CoverUMD/**"
      - ".github/workflows/抖音优化.yaml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "vite.utils.mts"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --dir scripts-vite/抖音优化 exec vue-tsc --noEmit
      - name: Build userscript
        run: pnpm --dir scripts-vite/抖音优化 exec vite build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-clean-userscript
          path: scripts-vite/抖音优化/dist/*.user.js
          if-no-files-found: error
